<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOVA - Mạng Xã Hội 0đ</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

    <!-- App Wrapper -->
    <div class="max-w-xl mx-auto min-h-screen bg-white shadow-xl flex flex-col justify-between">
        
        <!-- 1. MÀN HÌNH ĐĂNG NHẬP / ĐĂNG KÝ -->
        <div id="auth-screen" class="p-8 my-auto space-y-6">
            <div class="text-center">
                <h1 class="text-4xl font-black text-indigo-600 tracking-wider">NOVA</h1>
                <p class="text-sm text-slate-500 mt-1">Mạng xã hội cộng đồng phi lợi nhuận</p>
            </div>
            <div class="space-y-4 max-w-sm mx-auto">
                <input type="email" id="auth-email" placeholder="Nhập Email của bạn" class="w-full p-3 border rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                <input type="password" id="auth-password" placeholder="Mật khẩu" class="w-full p-3 border rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                <div class="flex gap-2 pt-2">
                    <button onclick="handleLogin()" class="flex-1 bg-indigo-600 text-white p-3 rounded-xl font-semibold hover:bg-indigo-700 transition text-sm">Đăng Nhập</button>
                    <button onclick="handleRegister()" class="flex-1 bg-slate-200 text-slate-700 p-3 rounded-xl font-semibold hover:bg-slate-300 transition text-sm">Đăng Ký</button>
                </div>
            </div>
        </div>

        <!-- 2. MÀN HÌNH CHÍNH (HIỆN KHI ĐÃ ĐĂNG NHẬP) -->
        <div id="main-screen" class="hidden flex-1 flex flex-col">
            <!-- Header -->
            <header class="bg-white border-b px-4 py-3 flex justify-between items-center sticky top-0 z-10">
                <h2 class="font-black text-xl text-indigo-600">NOVA</h2>
                <div class="flex items-center gap-3 text-xs">
                    <span id="nav-uid" class="text-slate-500 bg-slate-100 px-2.5 py-1 rounded-lg">UID: ...</span>
                    <button onclick="handleLogout()" class="text-red-500 font-semibold hover:underline">Đăng xuất</button>
                </div>
            </header>

            <!-- Main Feed & Content Container -->
            <main class="flex-1 p-4 space-y-6 overflow-y-auto pb-24">
                
                <!-- Khung Đăng Bài -->
                <div class="bg-white p-4 rounded-2xl border shadow-sm space-y-3">
                    <textarea id="post-input" placeholder="Hôm nay bạn muốn chia sẻ điều gì ở NOVA?" class="w-full p-3 border-none focus:outline-none resize-none text-sm" rows="3"></textarea>
                    <input type="text" id="post-media" placeholder="Link ảnh hoặc video (tuỳ chọn - URL hình ảnh/video)" class="w-full p-2 border rounded-xl text-xs focus:outline-none focus:ring-1 focus:ring-indigo-500">
                    
                    <div class="flex justify-between items-center pt-2 border-t">
                        <label class="flex items-center gap-2 text-xs text-slate-600 cursor-pointer select-none">
                            <input type="checkbox" id="post-anonymous" class="rounded text-indigo-600">
                            <span>🕵️ Đăng ẩn danh</span>
                        </label>
                        <button onclick="createNewPost()" class="bg-indigo-600 text-white px-5 py-2 rounded-xl text-sm font-semibold hover:bg-indigo-700 transition">Đăng bài</button>
                    </div>
                </div>

                <!-- Bảng Tin (Feed) -->
                <div id="feed-container" class="space-y-4">
                    <!-- Bài viết sẽ được render tự động vào đây -->
                </div>
            </main>

            <!-- Bottom Navigation Bar -->
            <nav class="bg-white border-t py-3 px-6 flex justify-around items-center fixed bottom-0 max-w-xl w-full text-xs font-semibold text-slate-500">
                <button onclick="switchTab('home')" class="text-indigo-600 flex flex-col items-center gap-1">🏠 <span>Trang chủ</span></button>
                <button onclick="switchTab('friends')" class="hover:text-indigo-600 flex flex-col items-center gap-1">👥 <span>Bạn bè</span></button>
                <button onclick="switchTab('messages')" class="hover:text-indigo-600 flex flex-col items-center gap-1">💬 <span>Tin nhắn</span></button>
                <button onclick="switchTab('groups')" class="hover:text-indigo-600 flex flex-col items-center gap-1">🛡️ <span>Nhóm</span></button>
                <button onclick="switchTab('profile')" class="hover:text-indigo-600 flex flex-col items-center gap-1">👤 <span>Hồ sơ</span></button>
            </nav>
        </div>

    </div>

    <!-- Script Xử Lý Logic Firebase Modular SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { 
            getAuth, 
            signInWithEmailAndPassword, 
            createUserWithEmailAndPassword, 
            signOut, 
            onAuthStateChanged 
        } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { 
            getFirestore, 
            collection, 
            addDoc, 
            doc, 
            updateDoc, 
            onSnapshot, 
            orderBy, 
            query, 
            serverTimestamp, 
            arrayUnion, 
            arrayRemove, 
            runTransaction,
            getDoc 
        } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        // Cấu hình Firebase chuẩn từ dự án NOVA
        const firebaseConfig = {
            apiKey: "AIzaSyAvZQWFacocqYNuJH5YG7mrV_xuPVvfN8s",
            authDomain: "nova-9a504.firebaseapp.com",
            projectId: "nova-9a504",
            storageBucket: "nova-9a504.firebasestorage.app",
            messagingSenderId: "1040280362414",
            appId: "1:1040280362414:web:9fffa61fd30123ec267c3f"
        };

        // Khởi tạo Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;

        // Đưa các hàm ra biến toàn cục (window) để các nút bấm trong HTML gọi được
        window.handleLogin = function() {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            if(!email || !password) return alert('Vui lòng nhập email và mật khẩu!');
            signInWithEmailAndPassword(auth, email, password).catch(err => alert(err.message));
        };

        window.handleRegister = function() {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            if(!email || !password) return alert('Vui lòng nhập email và mật khẩu!');
            createUserWithEmailAndPassword(auth, email, password).catch(err => alert(err.message));
        };

        window.handleLogout = function() {
            signOut(auth);
        };

        // Quản lý trạng thái đăng nhập
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('main-screen').classList.remove('hidden');
                document.getElementById('nav-uid').innerText = `UID: ${user.uid.slice(0, 6)}...`;
                loadFeedPosts();
            } else {
                currentUser = null;
                document.getElementById('auth-screen').classList.remove('hidden');
                document.getElementById('main-screen').classList.add('hidden');
            }
        });

        // Tạo bài viết mới
        window.createNewPost = function() {
            const content = document.getElementById('post-input').value.trim();
            const mediaUrl = document.getElementById('post-media').value.trim();
            const isAnonymous = document.getElementById('post-anonymous').checked;

            if(!content) return alert('Nội dung bài viết không được để trống!');

            addDoc(collection(db, 'posts'), {
                authorId: currentUser.uid,
                authorEmail: isAnonymous ? 'Ẩn danh' : currentUser.email,
                content: content,
                mediaUrl: mediaUrl,
                isAnonymous: isAnonymous,
                likes: [],
                shares: 0,
                createdAt: serverTimestamp()
            }).then(() => {
                document.getElementById('post-input').value = '';
                document.getElementById('post-media').value = '';
                document.getElementById('post-anonymous').checked = false;
            }).catch(err => alert(err.message));
        };

        // Tải bảng tin theo thời gian thực
        function loadFeedPosts() {
            const q = query(collection(db, 'posts'), orderBy('createdAt', 'desc'));
            onSnapshot(q, (snapshot) => {
                const feed = document.getElementById('feed-container');
                feed.innerHTML = '';
                
                if(snapshot.empty) {
                    feed.innerHTML = `<p class="text-center text-slate-400 text-sm py-6">Chưa có bài viết nào. Hãy là người đầu tiên đăng bài!</p>`;
                    return;
                }

                snapshot.forEach((docSnap) => {
                    const post = docSnap.data();
                    const postId = docSnap.id;
                    const isLiked = post.likes && post.likes.includes(currentUser.uid);

                    let mediaContent = '';
                    if (post.mediaUrl) {
                        if (post.mediaUrl.match(/\.(mp4|webm|ogg)$/i)) {
                            mediaContent = `<video src="${post.mediaUrl}" controls class="w-full rounded-xl max-h-80 object-cover mt-2"></video>`;
                        } else {
                            mediaContent = `<img src="${post.mediaUrl}" alt="Media" class="w-full rounded-xl max-h-80 object-cover mt-2">`;
                        }
                    }

                    feed.innerHTML += `
                        <div class="bg-white p-4 rounded-2xl border shadow-sm space-y-3">
                            <div class="flex justify-between items-center text-xs">
                                <span class="font-bold text-indigo-600">${post.isAnonymous ? '🕵️ Thành viên ẩn danh' : post.authorEmail}</span>
                                <span class="text-slate-400">Mã: ${postId.slice(0, 6)}</span>
                            </div>
                            <p class="text-sm text-slate-800 whitespace-pre-line">${post.content}</p>
                            ${mediaContent}
                            
                            <!-- Tương tác -->
                            <div class="flex gap-4 text-xs font-semibold text-slate-600 pt-2 border-t">
                                <button onclick="toggleLike('${postId}', ${JSON.stringify(post.likes || [])})" class="${isLiked ? 'text-red-500 font-bold' : 'hover:text-red-500'}">
                                    ❤️ ${(post.likes || []).length} Thích
                                </button>
                                <button onclick="sharePost('${postId}')" class="hover:text-indigo-600">
                                    🔄 Chia sẻ (${post.shares || 0})
                                </button>
                            </div>

                            <!-- Khu vực Bình luận -->
                            <div class="mt-2 pt-2 border-t space-y-2">
                                <div id="comments-${postId}" class="space-y-1 text-xs text-slate-600"></div>
                                <div class="flex gap-2 mt-1">
                                    <input type="text" id="comment-input-${postId}" placeholder="Viết bình luận..." class="flex-1 p-2 border rounded-xl text-xs focus:outline-none focus:ring-1 focus:ring-indigo-500">
                                    <button onclick="addComment('${postId}')" class="bg-slate-800 text-white px-3 py-1.5 rounded-xl text-xs hover:bg-black transition">Gửi</button>
                                </div>
                            </div>
                        </div>
                    `;
                    loadComments(postId);
                });
            });
        }

        // Thả tim bài viết
        window.toggleLike = function(postId, likes) {
            const postRef = doc(db, 'posts', postId);
            if (likes.includes(currentUser.uid)) {
                updateDoc(postRef, { likes: arrayRemove(currentUser.uid) });
            } else {
                updateDoc(postRef, { likes: arrayUnion(currentUser.uid) });
            }
        };

        // Chia sẻ bài viết
        window.sharePost = function(postId) {
            const postRef = doc(db, 'posts', postId);
            runTransaction(db, async (transaction) => {
                const sfDoc = await transaction.get(postRef);
                if (!sfDoc.exists()) return;
                const newShares = (sfDoc.data().shares || 0) + 1;
                transaction.update(postRef, { shares: newShares });
            }).then(() => alert('Đã chia sẻ bài viết thành công!'));
        };

        // Thêm bình luận
        window.addComment = function(postId) {
            const input = document.getElementById(`comment-input-${postId}`);
            const text = input.value.trim();
            if(!text) return;

            addDoc(collection(db, `posts/${postId}/comments`), {
                authorEmail: currentUser.email,
                text: text,
                createdAt: serverTimestamp()
            }).then(() => {
                input.value = '';
            });
        };

        // Hiển thị bình luận thời gian thực
        function loadComments(postId) {
            const q = query(collection(db, `posts/${postId}/comments`), orderBy('createdAt', 'asc'));
            onSnapshot(q, (snapshot) => {
                const container = document.getElementById(`comments-${postId}`);
                container.innerHTML = '';
                snapshot.forEach((docSnap) => {
                    const c = docSnap.data();
                    container.innerHTML += `
                        <div class="bg-slate-50 p-2 rounded-lg">
                            <span class="font-bold text-slate-700">${c.authorEmail}:</span> ${c.text}
                        </div>
                    `;
                });
            });
        }

        window.switchTab = function(tabName) {
            if(tabName === 'home') return;
            alert(`Tính năng [${tabName.toUpperCase()}] đang được phát triển tiếp theo theo yêu cầu của bạn!`);
        };
    </script>
</body>
</html>
